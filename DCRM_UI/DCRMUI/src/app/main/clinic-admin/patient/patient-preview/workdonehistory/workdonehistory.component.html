<div class="content-wrapper container-xxl p-0">
    <div class="content-body">
        <section class="drug-list-wrapper">
            <div class="card">
                <div class="row">
                    <div class="col-md-6 col-12">
                        <div class="d-flex justify-content-between align-items-center m-1">
                            <div class="d-flex align-items-center">
                                <label class="d-flex align-items-center">
                                    Show
                                    <select class="form-control mx-25" [(ngModel)]="selectedOption">
                                        <option value="10">10</option>
                                        <option value="25">25</option>
                                        <option value="50">50</option>
                                        <option value="100">100</option>
                                    </select>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="
              col-md-6 col-lg-4 col-12
              d-flex
              justify-content-start justify-content-md-end
              align-items-center
              offset-lg-2
            ">
                        <div class="row pr-1 pb-1 pb-md-0 align-items-center w-100">

                            <div class="col-10 col-md-12 mt-2 ml-1 ml-md-0 mt-md-0">
                                <label class="d-flex align-items-center mb-0 ml-1 ml-md-0">
                                    <input [(ngModel)]="searchValue"
                                           name="searchValue"
                                           type="search"
                                           class="form-control"
                                           placeholder="Search..."
                                           (keyup)="filterUpdate($event)"
                                           (search)="filterUpdate($event)" />
                                </label>
                            </div>
                        </div>
                    </div>          
                    <div class="col-xl-12 col-md-12 col-12">
                        <div class="col-md-2 pull-right text-right">
                            <a href="javascript://" (click)="printDiv()" class="btn btn-dark"><i class="fa fa-print"></i> Print</a>
                        </div>
                    </div>
                </div>
                <div class="row" id="printDiv">
                        <div *ngIf="loading==true" class="table-loading">
                            <div class="table-loading-text">
                                Loading...
                            </div>
                        </div>
                        <table class="table1 table-bordered table-hover" cellspacing="0" style="overflow:scroll;width:100%">
                            <thead>
                                <tr class="table-header">
                                    
                                </tr>
                            </thead>
                <!-- Invoice List Table -->
                <ngx-datatable [rows]="rows"
                               rowHeight="auto"
                               class="bootstrap core-bootstrap"
                               [limit]="selectedOption"
                               [columnMode]="ColumnMode.force"
                               [headerHeight]="50"
                               [footerHeight]="50"
                               [scrollbarH]="true">
                    <ngx-datatable-column name="#" prop="id" [width]="50">
                        <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
                            <input type="checkbox" [(ngModel)]="row.isSelected" />
                            {{ value }}
                          </ng-template>
                        <ng-template let-id="value" ngx-datatable-cell-template>
                            {{ id }}
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="Date" prop="date" [width]="90">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            <div class="row">
                                <div class="col-12">{{row.date | date: 'dd/MM/yyyy'}}</div>
                            </div>
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="Tooth Number" prop="toothName"></ngx-datatable-column>
                    <ngx-datatable-column name="Treatment Code">
                        <ng-template ngx-datatable-cell-template let-row="row">
                            <span *ngIf="row.treatmentCode!=null">{{row.treatmentCode}}</span>
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="Dr. Name" prop="doctorName"></ngx-datatable-column>
                    <ngx-datatable-column name="Note & Diagsis" prop="notesdiagnosis">
                        <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
                            <div *ngIf="!row.expanded">
                              {{ value | slice:0:20 }}
                              <span *ngIf="value.length > 20">
                                <a href="javascript://" (click)="toggleExpand(row)">... Show more</a>
                              </span>
                            </div>
                            <div *ngIf="row.expanded">
                              {{ value }}
                            </div>
                          </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="Status" prop="workdoneStatus" [width]="80"></ngx-datatable-column>
                    <ngx-datatable-column name="Amt Dues" prop="amtDueCurrentWork"  [width]="80"></ngx-datatable-column>
                    <ngx-datatable-column name="Actions" [sortable]="false" [width]="80">
                        <ng-template ngx-datatable-cell-template let-row="row">
                            <div class="d-flex align-items-center col-actions">
                                <!--<a class="mr-1"
                       container="body"
                       placement="top"
                       ngbTooltip="Edit Drug">
                        <i size="18" data-feather="edit"></i>
                    </a>-->
                                <a class="mr-1"
                                   container="body"
                                   placement="top"
                                   href="javascript:void(0)"
                                   (click)="delete(row.id)"
                                   ngbTooltip="Delete">
                                    <i size="18" data-feather="trash"></i>
                                </a>
                            </div>
                        </ng-template>
                    </ngx-datatable-column>
                </ngx-datatable>
                </table>
                </div>
            </div>
        </section>
    </div>
</div>

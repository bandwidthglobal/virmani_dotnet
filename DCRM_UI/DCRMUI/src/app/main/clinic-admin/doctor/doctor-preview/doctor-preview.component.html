<div class="content-wrapper container-xxl p-0">
    <div class="content-body">
        <section id="multiple-column-form">
            <div class="row match-height">
                <div class="col-12">

                    <div class="row">
                        <div class="col-md-10 col-12">
                            <h4 class="card-title">Doctor Details</h4>
                        </div>
                        <div class="col-md-1 col-12" style="float:right">
                            <a class="btn btn-primary ml-2 waves-effect waves-float waves-light" href="/admin/doctor/list">Back</a>
                        </div>
                    </div>
                    <div class="card-body">

                        <div class="row">
                            <div class="col-md-4 col-12">
                                <div class="form-group">
                                    <label for="first-name-column">Thumb</label><br />
                                    <img src="#" alt="Alternate Text" />
                                </div>
                            </div>
                            <div class="col-md-4 col-12">
                                <div class="form-group">
                                    <label for="basic-medicinetype">Name</label>
                                    <br />
                                    <span class="font-weight-bold d-block text-nowrap font-medium-1">{{doctor.name}}</span>
                                </div>
                            </div>
                            <div class="col-md-4 col-12">
                                <div class="form-group">
                                    <label for="mc" class="form-label">Gender</label>
                                    <br />
                                    <span class="font-weight-bold d-block text-nowrap font-medium-1">{{doctor.gender}}</span>
                                </div>
                            </div>
                            <div class="col-md-4 col-12">
                                <div class="form-group">

                                    <label for="brand-column">DOB</label>
                                    <br />
                                    <span class="font-weight-bold d-block text-nowrap font-medium-1">{{doctor.dob}}</span>
                                </div>
                            </div>

                            <div class="col-md-4 col-12">
                                <div class="form-group">
                                    <label for="country-floating">Marital Status</label>
                                    <br />
                                    <span class="font-weight-bold d-block text-nowrap font-medium-1">{{doctor.marital_status}}</span>
                                </div>
                            </div>
                            <div class="col-md-4 col-12">
                                <div class="form-group">
                                    <label for="basic-salt">Qualification</label>
                                    <br />
                                    <span class="font-weight-bold d-block text-nowrap font-medium-1">{{doctor.qualification}}</span>
                                </div>
                            </div>
                            <div class="col-md-4 col-12">
                                <div class="form-group">
                                    <label for="form">Email  </label>
                                    <br />
                                    <span class="font-weight-bold d-block text-nowrap font-medium-1">{{doctor.email}}</span>
                                </div>
                            </div>
                            <div class="col-md-4 col-12">
                                <div class="form-group">
                                    <label for="dosageq">Phone </label>
                                    <br />
                                    <span class="font-weight-bold d-block text-nowrap font-medium-1">{{doctor.phone1}}</span>
                                </div>
                            </div>
                            <div class="col-md-4 col-12">
                                <div class="form-group">
                                    <label for="doseno">Speciality </label>
                                    <br />
                                    <span class="font-weight-bold d-block text-nowrap font-medium-1">{{doctor.speciality}}</span>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

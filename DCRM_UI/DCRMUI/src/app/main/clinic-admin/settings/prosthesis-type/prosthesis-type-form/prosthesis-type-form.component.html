<div class="content-wrapper container-xxl p-0">
    <div class="content-body">
        <section class="invoice-add-wrapper">
            <div class="row invoice-add">
                <!-- Invoice Add Left starts -->
                <div class="col-xl-12 col-md-12 col-12">
                    <div class="card invoice-preview-card">
                        <!-- Header starts -->
                        <div class="card-body invoice-padding pb-0">
                            <div class="row">
                                <div class="col-xl-9 col-md-12 col-12">
                                    <div *ngIf="isEdit;else other_content">
                                        <h3 class="text-primary invoice-logo">Update Prosthesis Type</h3>
                                    </div>
                                    <ng-template #other_content><h3 class="text-primary invoice-logo">Create New Prosthesis Type</h3></ng-template>

                                </div>
                                <div class="col-xl-3 col-md-8 col-12">
                                    <a class="btn btn-primary ml-2 fl-right" routerLink="/admin/settings/prosthesistype/list" rippleEffect>
                                        <i class="fa fa-list"></i> All Prosthesis Type
                                    </a>
                                </div>
                            </div>
                            <ngb-alert [type]="'danger'" [dismissible]="false" *ngIf="error">
                                <div class="alert-body">
                                    <p>{{ error }}</p>
                                </div>
                            </ngb-alert>
                            <div class="box-body">
                                <form [formGroup]="prosthesisTypeForm" (ngSubmit)="onSubmit()">
                                    
                                    <div class="form-group">
                                        <label>Name <span class="text-danger">*</span></label>
                                        <input type="text"
                                               [(ngModel)]="prosthesisTypeModel.name"
                                               formControlName="name"
                                               class="form-control"
                                               placeholder=""
                                               aria-describedby="name"
                                               tabindex="2"
                                               autofocus
                                               [ngClass]="{ 'is-invalid': submitted && f.name.errors }" />
                                    </div>
                                    <div class="row m-t-30">
                                        <div class="col-sm-12">
                                            <button type="submit" class="btn btn-primary pull-left"><i class="ficon flaticon-check"></i> Save</button>
                                        </div>
                                    </div>

                                </form>

                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </div>
    <!--/  Add New Customer Sidebar -->
</div>
